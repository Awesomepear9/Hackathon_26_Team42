<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: Inhalt bis in die Ränder um Notch und Home-Indikator, Abstände über env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f7fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1121" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/digifl-logo.svg#icon" />
    <title>DigiFL</title>
    <script>
      // Systemeinstellung als .dark-Klasse übernehmen (wie in der DigiFL-App)
      const mq = matchMedia('(prefers-color-scheme: dark)')
      const sync = () => document.documentElement.classList.toggle('dark', mq.matches)
      sync()
      mq.addEventListener('change', sync)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
